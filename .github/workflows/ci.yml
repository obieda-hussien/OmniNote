name: Android CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build a Release APK (signed when configured)"
        required: false
        default: true
        type: boolean
      require_signing:
        description: "Require the configured production signing key (always required for tags)"
        required: false
        default: false
        type: boolean
      enable_extended_checks:
        description: "Enable additional compile checks"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dkotlin.incremental=false"
  GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: false
  MAX_DEBUG_APK_SIZE_KB: 153600

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: quality-${{ runner.os }}-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'app/build.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            quality-${{ runner.os }}-

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Run lint checks
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dkotlin.incremental=false -Dorg.gradle.jvmargs=-Xmx4g"
        run: |
          ./gradlew --no-daemon --max-workers 1 \
            :app:lintDebug \
            --continue

      - name: Upload quality reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: quality-reports-${{ github.run_number }}
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21" # Robolectric Android 16 requires JDK 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Run compile + unit tests
        run: |
          ./gradlew --no-daemon \
            :app:compileDebugKotlin :app:testDebugUnitTest \
            --continue

      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PYTEST'
          import pathlib, xml.etree.ElementTree as ET
          for path in pathlib.Path('app/build/test-results').rglob('TEST-*.xml'):
              root = ET.parse(path).getroot()
              print(f"{root.get('name')}: {root.get('tests')} tests, {root.get('failures')} failures")
              for case in root.findall('testcase'):
                  for failure in case.findall('failure'):
                      print(f"FAILED {case.get('name')}: {failure.get('message')}")
          PYTEST

      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14

      - name: Optional extended checks
        if: github.event_name == 'workflow_dispatch' && inputs.enable_extended_checks == true
        run: |
          ./gradlew --no-daemon \
            :app:compileReleaseKotlin :app:testReleaseUnitTest \
            --continue

  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy Results Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: trivy-results-${{ github.run_number }}
          path: trivy-results.sarif
          retention-days: 14

  android-debug:
    name: Android Debug Build
    runs-on: ubuntu-24.04
    needs: [ code-quality, test, security-scan ]
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dkotlin.incremental=false -Dorg.gradle.jvmargs=-Xmx4g"
        run: |
          ./gradlew --no-daemon --max-workers 1 \
            :app:assembleDebug

      - name: APK size gate
        run: |
          MAX_KB="${{ env.MAX_DEBUG_APK_SIZE_KB }}"
          APK_PATHS=$(find app/build/outputs/apk -name '*.apk' | grep debug)

          if [ -z "$APK_PATHS" ]; then
            echo "No APKs found!"
            exit 1
          fi

          echo "Checking APK sizes (Max: ${MAX_KB}KB)..."
          for APK_PATH in $APK_PATHS; do
            SIZE_KB="$(du -k "$APK_PATH" | cut -f1)"
            echo "- $APK_PATH: ${SIZE_KB}KB"
            if [ "$SIZE_KB" -gt "$MAX_KB" ]; then
              echo "::error::APK size ${SIZE_KB}KB exceeds maximum ${MAX_KB}KB for $APK_PATH"
              exit 1
            fi
          done

      - name: Verify debug APK identity and version
        run: python3 .github/scripts/verify-apk.py app/build/outputs/apk/debug

      - name: Upload debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: app-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Debug build summary
        run: |
          {
            echo "## Android Debug Build"
            echo ""
            echo "| APK File | Size |"
            echo "|----------|------|"

            find app/build/outputs/apk -name '*.apk' | grep debug | while read APK_PATH; do
              APK_SIZE="$(du -sh "$APK_PATH" | cut -f1)"
              echo "| \`$(basename "$APK_PATH")\` | $APK_SIZE |"
            done

            echo ""
            echo "- Run: #${{ github.run_number }}"
          } >> "$GITHUB_STEP_SUMMARY"

  android-release:
    name: Android Release Build
    runs-on: ubuntu-24.04
    needs: [ code-quality, test, security-scan ]
    if: github.event_name != 'workflow_dispatch' || inputs.build_release
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Prepare signing configuration
        id: signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.require_signing) }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
            if [ "$REQUIRE_SIGNING" = "true" ]; then
              echo "::error::Production signing was requested. Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD."
              exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "Release compilation will produce an unsigned APK; use Debug for installation." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Signing configuration is incomplete: $name is missing."
              exit 1
            fi
          done
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 must contain a valid base64-encoded keystore."
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/release.keystore"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The keystore, store password or signing alias is invalid."
            exit 1
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "mode=signed" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dkotlin.incremental=false -Dorg.gradle.jvmargs=-Xmx4g"
          STORE_PASSWORD: ${{ steps.signing.outputs.ready == 'true' && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ steps.signing.outputs.ready == 'true' && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ steps.signing.outputs.ready == 'true' && secrets.KEY_PASSWORD || '' }}
        run: |
          ./gradlew --no-daemon --max-workers 1 \
            :app:assembleRelease

      - name: Verify production signature
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          for apk in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Verify optimized release APK
        run: |
          python3 .github/scripts/verify-apk.py app/build/outputs/apk/release
          test -s app/build/outputs/mapping/release/mapping.txt
          du -h app/build/outputs/apk/release/*.apk

      - name: Upload R8 mapping and shrink reports
        uses: actions/upload-artifact@v6
        with:
          name: release-R8-reports-${{ github.run_number }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: Omni-NotePlus-release-${{ steps.signing.outputs.mode || 'unsigned' }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Cleanup keystore file
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'release.keystore').unlink(missing_ok=True)
          PY

      - name: Create GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-24.04
    if: always()
    needs: [ code-quality, test, security-scan, android-debug, android-release ]

    steps:
      - name: Write job summary
        run: |
          {
            echo "# Android Pipeline #${{ github.run_number }}"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Code Quality | ${{ needs.code-quality.result }} |"
            echo "| Unit Tests | ${{ needs.test.result }} |"
            echo "| Security Scan | ${{ needs.security-scan.result }} |"
            echo "| Android Debug | ${{ needs.android-debug.result }} |"
            echo "| Android Release | ${{ needs.android-release.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

